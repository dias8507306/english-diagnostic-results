<style>
:root{
  --bg:#F4F6FF;
  --surface:#FFFFFF;
  --text:#1E2030;
  --muted:#6D7885;
  --line:#E6E0EC;
  --violet:#6E4FD8;
  --violet-600:#5B3CC4;
  --violet-deep:#2E0F4C;
  --violet-soft:#F2EFFC;
  --blue:#2857FC;
  --gold:#F4CD4B;
  --gold-hover:#F7D766;
  --green:#048848;
  --orange:#E8590C;
  --ease:cubic-bezier(.2,.7,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --hdr:68px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}

/* Header */
.hdr{position:fixed;top:12px;left:0;right:0;z-index:50;padding:0 12px}
.hdr-in{max-width:1180px;height:var(--hdr);margin:0 auto;padding:0 10px 0 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.97);border:1px solid rgba(230,224,236,.9);border-radius:20px;box-shadow:0 12px 40px -16px rgba(20,8,50,.35)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--violet-deep)}
.logo svg{width:40px;height:40px;flex:none}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;line-height:1}
.logo span{line-height:1.05}
.hdr-sp{flex:1}
.lang{display:flex;padding:4px;border-radius:999px;background:var(--violet-soft)}
.lang button{height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--violet-600);transition:background-color .2s,color .2s}
.lang button[aria-pressed="true"]{background:var(--violet);color:#fff}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap;transition:transform .35s var(--spring),box-shadow .35s var(--ease),background-color .2s,border-color .2s}
.btn svg{width:18px;height:18px;flex:none;transition:transform .35s var(--spring)}
.btn:hover{transform:translateY(-2px)}
.btn:hover svg{transform:translateX(3px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-gold{background:var(--gold);color:#1B1300;box-shadow:0 12px 30px -12px rgba(244,205,75,.75),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.btn-gold:hover{background:var(--gold-hover);box-shadow:0 20px 44px -14px rgba(244,205,75,.95),0 0 0 6px rgba(244,205,75,.16)}
.btn-gold:hover::after{transform:translateX(120%)}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn-outline:hover{border-color:#C9BDF0;box-shadow:0 10px 24px -14px rgba(46,15,76,.4)}
.btn-sm{height:40px;padding:0 16px;font-size:14px}

/* Hero */
.hero{position:relative;z-index:2;margin:8px;border-radius:32px;padding:calc(var(--hdr) + 76px) 0 88px;color:#fff;
  background-image:
    radial-gradient(70% 60% at 10% 6%,rgba(110,79,216,.72),transparent 60%),
    radial-gradient(55% 55% at 94% 26%,rgba(40,87,252,.46),transparent 62%),
    radial-gradient(50% 45% at 55% 108%,rgba(163,92,246,.42),transparent 60%),
    linear-gradient(165deg,#2E0F4C 0%,#1A0B3A 45%,#0E1236 100%)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.25;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(80% 70% at 50% 30%,#000,transparent)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#EDE7FF;font-size:14px;font-weight:500}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(244,205,75,.2)}
.hero h1{margin-top:22px;font-size:clamp(34px,4.6vw,58px);line-height:1.05;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.hl{background:linear-gradient(95deg,#F4CD4B 0%,#FFE9A3 40%,#D9CCFF 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{margin-top:20px;max-width:520px;font-size:clamp(16px,1.4vw,18px);line-height:1.62;color:rgba(255,255,255,.8)}
.steps{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.steps li{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.85);font-size:15px}
.steps b{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--gold);font-size:14px}

/* Search card */
.card{background:var(--surface);color:var(--text);border-radius:28px;padding:28px;box-shadow:0 40px 80px -30px rgba(10,4,40,.6)}
.card h2{font-size:22px;letter-spacing:-.02em}
.card .card-sub{margin-top:6px;color:var(--muted);font-size:15px}
.field{margin-top:18px}
.field label{display:block;margin-bottom:8px;font-size:14px;font-weight:600}
.field input{width:100%;height:54px;padding:0 18px;border-radius:16px;border:1.5px solid var(--line);background:#FBFAFE;font:inherit;font-size:16px;color:var(--text);transition:border-color .2s,box-shadow .2s,background-color .2s}
.field input::placeholder{color:#A3A9B5}
.field input:focus{outline:none;border-color:var(--violet);background:#fff;box-shadow:0 0 0 4px rgba(110,79,216,.14)}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 50px -20px rgba(20,8,50,.45);max-height:300px;overflow:auto}
.sug li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:500}
.sug li[aria-selected="true"],.sug li:hover{background:var(--violet-soft)}
.sug li i{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-style:normal;font-size:13px;font-weight:700}
.sug li small{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted);font-weight:400}
.sug mark{background:none;color:var(--violet);font-weight:700}
.platform{margin-top:28px;display:flex;align-items:center;gap:14px;max-width:440px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;transition:background-color .2s,border-color .2s,transform .35s var(--spring)}
.platform:hover{background:rgba(255,255,255,.14);border-color:rgba(244,205,75,.6);transform:translateY(-2px)}
.platform-logo{width:44px;height:44px;flex:none}
.platform span{flex:1;min-width:0}
.platform b{display:block;font-size:16px}
.platform small{display:block;font-size:14px;color:rgba(255,255,255,.72)}
.platform-go{width:20px;height:20px;flex:none;color:var(--gold);transition:transform .35s var(--spring)}
.platform:hover .platform-go{transform:translateX(4px)}
.cta-btns{display:flex;flex-wrap:wrap;gap:12px}
.btn-glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff}
.btn-glass:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4)}
.field .hint{margin-top:6px;font-size:13px;color:var(--muted)}
.card .btn{width:100%;margin-top:22px}
.err{display:none;margin-top:16px;padding:12px 14px;border-radius:14px;background:#FFF1EB;color:#9A3412;font-size:14px;line-height:1.45}
.err.show{display:block;animation:shake .4s var(--ease)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Result */
.result{padding:56px 0 24px;scroll-margin-top:96px}
.result[hidden]{display:none}
.r-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.r-head .kicker{font-size:14px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.06em}
.r-head h2{margin-top:6px;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.03em;line-height:1.1}
.r-head .meta{margin-top:6px;color:var(--muted)}
.r-actions{display:flex;gap:10px;flex-wrap:wrap}
.grid{margin-top:24px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 18px 50px -34px rgba(46,15,76,.45)}
.panel h3{font-size:18px;letter-spacing:-.01em}
.score{display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{position:relative;width:200px;height:200px;margin-top:8px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center}
.ring .val b{font-size:52px;line-height:1;letter-spacing:-.04em}
.ring .val span{margin-top:4px;font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.lvl-1{background:#E7F6EE;color:var(--green)}
.lvl-2{background:#EEF2FF;color:var(--blue)}
.lvl-3{background:#FFF6D6;color:#8A5A00}
.lvl-4{background:#FFF1EB;color:var(--orange)}
.score p{margin-top:12px;color:var(--muted);font-size:15px;max-width:320px}
.cmp{margin-top:18px;width:100%;padding-top:18px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.cmp b{color:var(--text)}

.skills{margin-top:18px;display:grid;gap:18px}
.sk-top{display:flex;align-items:center;gap:10px}
.sk-ico{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:12px;background:var(--violet-soft);color:var(--violet)}
.sk-ico svg{width:18px;height:18px}
.sk-name{flex:1;font-weight:600}
.sk-name small{display:block;font-weight:400;font-size:13px;color:var(--muted);line-height:1.2}
.sk-val{font-weight:700;font-size:18px}
.bar{position:relative;margin-top:10px;height:12px;border-radius:999px;background:#EEF0F6}
.bar .fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--blue));transition:width 1.1s var(--ease)}
.bar .fill.low{background:linear-gradient(90deg,#F59E0B,var(--orange))}
.bar .avg{position:absolute;top:-4px;width:3px;height:20px;border-radius:2px;background:var(--violet-deep);opacity:.35}
.legend{margin-top:18px;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:18px;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--blue))}
.legend i.a{width:3px;height:14px;border-radius:2px;background:var(--violet-deep);opacity:.35}

.tips{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid.one{grid-template-columns:minmax(0,1fr);max-width:520px;margin-left:auto;margin-right:auto}
.pend{margin-top:24px;text-align:center}
.pend p{margin-top:8px;color:var(--muted)}
.tip-list{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.tip-list li{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--bg)}
.tip-list li b{display:block}
.tip-list li span{display:block;margin-top:2px;font-size:14px;color:var(--muted)}
.dot{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;color:#fff;font-size:14px;font-weight:700}
.dot svg{width:16px;height:16px}
.dot.g{background:var(--green)}
.dot.o{background:var(--orange)}

.cta{margin-top:20px;border-radius:28px;padding:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;color:#fff;
  background:radial-gradient(60% 120% at 0% 0%,rgba(110,79,216,.85),transparent 60%),radial-gradient(60% 120% at 100% 100%,rgba(40,87,252,.7),transparent 60%),linear-gradient(135deg,#2E0F4C,#0E1236)}
.cta h3{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em}
.cta p{margin-top:6px;color:rgba(255,255,255,.78);max-width:560px}

.ftr{padding:40px 0 48px;color:var(--muted);font-size:14px}
.ftr .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:24px;border-top:1px solid var(--line)}
.ftr .logo{font-size:18px}
.ftr .logo svg{width:32px;height:32px}
.ftr a:hover{color:var(--violet)}
.ig{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--text);font-weight:600}
.ig svg{width:18px;height:18px;color:#D6249F}

.reveal{animation:rise .7s var(--ease) both}
.reveal:nth-child(2){animation-delay:.08s}
.reveal:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .hero-grid,.grid,.tips{grid-template-columns:minmax(0,1fr)}
  .hero{padding:calc(var(--hdr) + 48px) 0 56px}
}
@media (max-width:600px){
  .hero{margin:6px;border-radius:24px}
  .card,.panel{padding:22px;border-radius:24px}
  .logo small{display:none}
  .hdr-cta{display:none}
  .r-actions{width:100%}
  .r-actions .btn{flex:1}
  .cta{padding:24px}
  .cta .btn,.cta-btns{width:100%}
  .steps{display:none}
}
@media print{
  .hdr,.hero,.r-actions,.cta,.ftr{display:none!important}
  body{background:#fff}
  .result{padding-top:0}
  .panel{box-shadow:none;break-inside:avoid}
  .bar .fill{transition:none}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="logo" href="#top" aria-label="EduApp">
      <svg viewBox="0 0 192 192" aria-hidden="true"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a4fd6"/><stop offset="1" stop-color="#2857fc"/></linearGradient></defs><rect x="4" y="4" width="184" height="184" rx="44" fill="url(#eg)"/><text x="96" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="#fff">EA</text></svg>
      <span>eduapp<small data-t="brandSub"></small></span>
    </a>
    <div class="hdr-sp"></div>
    <div class="lang" role="group" aria-label="Тіл / Язык">
      <button type="button" data-lang="kk" aria-pressed="true">Қаз</button>
      <button type="button" data-lang="ru" aria-pressed="false">Рус</button>
    </div>
    <a class="btn btn-gold btn-sm hdr-cta" href="https://eduapp.example.com" target="_blank" rel="noopener" data-t="site"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="eyebrow"><i></i><span data-t="eyebrow"></span></span>
        <h1 data-t="h1" data-html></h1>
        <p class="hero-sub" data-t="sub"></p>
        <ol class="steps">
          <li><b>1</b><span data-t="step1"></span></li>
          <li><b>2</b><span data-t="step2"></span></li>
        </ol>
        <a class="platform" href="https://eduapp.example.com" target="_blank" rel="noopener">
          <svg class="platform-logo" viewBox="0 0 192 192" aria-hidden="true"><rect x="4" y="4" width="184" height="184" rx="44" fill="url(#eg)"/><text x="96" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="#fff">EA</text></svg>
          <span><b data-t="platformTitle"></b><small data-t="platformText"></small></span>
          <svg class="platform-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>

      <form class="card" id="form" novalidate autocomplete="off">
        <h2 data-t="formTitle"></h2>
        <p class="card-sub" data-t="formSub"></p>
        <div class="field ac">
          <label for="name" data-t="nameLabel"></label>
          <input id="name" name="name" type="text" data-ph="namePh" required role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug">
          <ul class="sug" id="sug" role="listbox" hidden></ul>
        </div>
        <div class="field" id="pinField" hidden>
          <label for="pin" data-t="pinLabel"></label>
          <input id="pin" name="pin" type="text" inputmode="numeric" maxlength="4" data-ph="pinPh">
        </div>
        <button class="btn btn-gold" type="submit"><span data-t="submit"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="err" id="err" role="alert"></p>
      </form>
    </div>
  </section>

  <section class="result wrap" id="result" hidden aria-live="polite"></section>
</main>

<footer class="ftr">
  <div class="wrap">
    <span class="logo"><svg viewBox="0 0 192 192" aria-hidden="true"><rect x="4" y="4" width="184" height="184" rx="44" fill="url(#eg)"/><text x="96" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="72" fill="#fff">EA</text></svg>eduapp</span>
    <a class="ig" href="https://www.instagram.com/eduapp_demo/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>@eduapp_demo</a>
    <span>© <span id="yr"></span> EduApp · <a href="https://eduapp.example.com" target="_blank" rel="noopener">eduapp.example.com</a></span>
  </div>
</footer>

<script>

/* --- Ядро поиска: должно совпадать с build.py --- */
const TR = {"а":"a","ә":"a","б":"b","в":"v","г":"g","ғ":"g","д":"d","е":"e","ё":"e","ж":"zh","з":"z","и":"i","й":"i","і":"i","к":"k","қ":"k","л":"l","м":"m","н":"n","ң":"n","о":"o","ө":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ұ":"u","ү":"u","ф":"f","х":"h","һ":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
function words(name){
  let s = [...name.toLowerCase()].map(ch => TR[ch] ?? ch).join("");
  s = s.replaceAll("zh","j").replaceAll("kh","h").replaceAll("y","i").replaceAll("w","u").replaceAll("q","k");
  s = s.replace(/[^a-z]+/g," ").replace(/(.)\1+/g,"$1");
  return s.split(" ").filter(Boolean).sort();
}
function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function unseal(hex, key){
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16) ^ (cyrb53(key + ":" + i, 99) & 255);
  return new TextDecoder().decode(bytes);
}
function lookup(name, pin){
  const ws = words(name);
  if (!ws.length) return null;
  const hitOf = key => { const hit = DATA.k[cyrb53(key, 1).toString(36)];
    return hit && {name: unseal(hit[1], key), grade: DATA.s[hit[0]][0], s: DATA.s[hit[0]].slice(1)}; };
  const full = ws.join(" ");
  // одинаковое имя у разных детей — нужны последние 4 цифры телефона
  if ((DATA.p || []).includes(cyrb53(full, 1).toString(36))) return pin ? hitOf(full + "#" + pin) || "pinBad" : "pin";
  for (const v of [full, ...ws]){
    const r = hitOf(v);
    if (r) return r;
  }
  return DATA.a.includes(cyrb53(full, 1).toString(36)) ? "amb" : null;
}

const avgFor = grade => {
  const rows = DATA.s.filter(r => r[0] === grade && r[1] >= 0), sum = [0,0,0,0,0,0], cnt = [0,0,0,0,0,0];
  rows.forEach(r => r.slice(1).forEach((v, i) => { sum[i] += v; cnt[i]++; }));
  return sum.map((v, i) => cnt[i] ? v / cnt[i] : 0);
};

function markName(name, typed){
  // подсвечиваем слова, совпавшие с введённым
  return name.split(/(\s+)/).map(part => {
    const w = words(part)[0];
    return w && typed.some(t => w.startsWith(t)) ? "<mark>" + esc(part) + "</mark>" : esc(part);
  }).join("");
}

    .sort((a, b) => a.name.localeCompare(b.name)).slice(0, 7);
  if (!sugItems.length){ closeSug(); return; }
  sugActive = -1;
  const t = I18N[lang];
  $("#sug").innerHTML = sugItems.map((x, k) => {
    const ini = x.name.split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();
    const g = DATA.s[x.i][0];
    return `<li role="option" id="sug-${k}" data-k="${k}" aria-selected="false"><i>${esc(ini)}</i><span>${markName(x.name, typed)}</span>${g ? `<small>${t.gradeShort(g)}</small>` : ""}</li>`;
  }).join("");
  $("#sug").hidden = false; $("#name").setAttribute("aria-expanded", "true");
}
function pickSug(k){
  $("#name").value = sugItems[k].name; closeSug();
  $("#form").requestSubmit();
}
function setPin(on){ $("#pinField").hidden = !on; if (!on) $("#pin").value = ""; }
$("#name").addEventListener("input", () => { setPin(false); showSug(); });
$("#name").addEventListener("focus", showSug);
$("#name").addEventListener("keydown", e => {
  if ($("#sug").hidden || !sugItems.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    sugActive = (sugActive + (e.key === "ArrowDown" ? 1 : -1) + sugItems.length) % sugItems.length;
    $("#sug").querySelectorAll("li").forEach((li, k) => li.setAttribute("aria-selected", k === sugActive));
    $("#name").setAttribute("aria-activedescendant", "sug-" + sugActive);
  } else if (e.key === "Enter" && sugActive >= 0){
    e.preventDefault(); pickSug(sugActive);
  } else if (e.key === "Escape"){
    closeSug();
  }
});
$("#sug").addEventListener("mousedown", e => {
  const li = e.target.closest("li");
  if (li){ e.preventDefault(); pickSug(+li.dataset.k); }
});
document.addEventListener("click", e => { if (!e.target.closest(".ac")) closeSug(); });

$("#form").addEventListener("submit", ev => {
  ev.preventDefault();
  closeSug();
  const name = $("#name").value.trim();
  if (!name) return showErr("errEmpty");
  const pin = $("#pin").value.replace(/\D/g, "");
  const r = lookup(name, pin.length === 4 ? pin : "");
  if (r === "pin" || r === "pinBad"){
    current = null; $("#result").hidden = true; setPin(true); $("#pin").focus();
    return showErr(r === "pin" ? "errPin" : "errPinBad");
  }
  if (!r || r === "amb"){ current = null; $("#result").hidden = true; return showErr(r ? "errAmb" : "errNone"); }
  $("#err").classList.remove("show");
  current = r; render(r);
});
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("ea-lang", lang); } catch (e) {}
  applyLang();
});
$("#yr").textContent = new Date().getFullYear();
applyLang();
</script>
</body>
